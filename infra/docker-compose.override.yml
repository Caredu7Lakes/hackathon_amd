services:
  backend:
    volumes:
      - ../backend:/app
      - ${USERPROFILE}/.aws:/root/.aws:ro
    environment:
      - AWS_PROFILE=default
      - AWS_REGION=us-east-1
    command: sh -c "if [ ! -f data/faiss_index/index.faiss ]; then python -m app.rag.ingest; fi && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
